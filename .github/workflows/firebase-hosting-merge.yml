# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: src/yarn.lock

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: src
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: src
        env:
          VITE_GOOGLE_AI_API_KEY: ${{ secrets.VITE_GOOGLE_AI_API_KEY }}
          VITE_GEMINI_MODEL: ${{ vars.VITE_GEMINI_MODEL || 'gemini-2.0-flash-exp' }}
        run: yarn build

      - name: Validate Firestore rules locally
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-acfmart "echo Firestore rules valid"

      - name: Check Firebase secret
        id: check-firebase
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOMMERCE_ACF }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            echo "has_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_ECOMMERCE_ACF secret is not set – skipping production deploy."
          fi

      - name: Check Firestore deploy secret
        id: check-firestore
        env:
          FIREBASE_RULES_SA: ${{ secrets.FIREBASE_RULES_SERVICE_ACCOUNT_ECOMMERCE_ACF }}
        run: |
          if [ -n "$FIREBASE_RULES_SA" ]; then
            echo "has_rules_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rules_secret=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_RULES_SERVICE_ACCOUNT_ECOMMERCE_ACF is not set – Firestore rules were validated locally but not deployed."
          fi

      - name: Deploy Firestore rules and indexes
        if: steps.check-firestore.outputs.has_rules_secret == 'true'
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_RULES_SERVICE_ACCOUNT_ECOMMERCE_ACF }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx -y firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project ecommerce-acf --non-interactive

      - name: Deploy to Firebase Hosting — acfmart (live)
        if: steps.check-firebase.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOMMERCE_ACF }}
          channelId: live
          projectId: ecommerce-acf
          target: acfmart
          entryPoint: "./"

      - name: Deploy to Firebase Hosting — acfmart-store (live)
        if: steps.check-firebase.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOMMERCE_ACF }}
          channelId: live
          projectId: ecommerce-acf
          target: acfmart-store
          entryPoint: "./"

      - name: Deploy to Firebase Hosting — acfmart-cloud (live)
        if: steps.check-firebase.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOMMERCE_ACF }}
          channelId: live
          projectId: ecommerce-acf
          target: acfmart-cloud
          entryPoint: "./"

      - name: Deploy to Firebase Hosting — acfmart-online (live)
        if: steps.check-firebase.outputs.has_secret == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ECOMMERCE_ACF }}
          channelId: live
          projectId: ecommerce-acf
          target: acfmart-online
          entryPoint: "./"
