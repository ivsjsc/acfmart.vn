<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="zalo-platform-site-verification" content="GuQ_0wAp5Wn3meCmcCiE5L70tn6zjWvEDJCt" />
    <title>ACFMart.vn</title>
    <script>
      // Unregister any service worker registered by an older build so the
      // browser stops trying to fetch /sw.js (which currently returns the
      // SPA's HTML fallback and triggers a MIME-type console error).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister() })
        }).catch(function () { /* no-op */ })
      }
    </script>
    <meta name="theme-color" content="#dc2626" />
    <meta name="description" content="Sàn thương mại điện tử chống hàng giả, xác thực sản phẩm chính hãng bằng QR. Mua sắm an tâm, đổi trả 7 ngày, giao toàn quốc." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ACFMart" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ACFMart",
        "url": "https://acfmart.vn",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://acfmart.vn/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #f8f9fa; }
      #root { min-height: 100vh; }
      .acf-initial-loader {
        display: flex; align-items: center; justify-content: center;
        height: 100vh; font-family: system-ui, sans-serif; font-size: 16px; color: #dc2626;
        gap: 12px;
      }
      .acf-initial-loader::after {
        content: ''; width: 22px; height: 22px;
        border: 3px solid rgba(220, 38, 38, 0.25); border-top-color: #dc2626;
        border-radius: 50%; animation: acf-spin 0.8s linear infinite;
      }
      @keyframes acf-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <img src="/logov.png" alt="ACFMart" style="width: 120px; height: auto;" />
      </div>
    </div>
    <!-- 修改：将 /src/main.tsx 改为 ./main.tsx -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
