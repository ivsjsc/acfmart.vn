<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="zalo-platform-site-verification" content="GuQ_0wAp5Wn3meCmcCiE5L70tn6zjWvEDJCt" />
    <title>ACFMart.vn</title>
    <script>
      // Unregister any service worker registered by an older build so the
      // browser stops trying to fetch /sw.js (which currently returns the
      // SPA's HTML fallback and triggers a MIME-type console error).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister() })
        }).catch(function () { /* no-op */ })
      }
    </script>
    <meta name="theme-color" content="#dc2626" />
    <meta name="description" content="Sàn thương mại điện tử chống hàng giả, xác thực sản phẩm chính hãng bằng QR. Mua sắm an tâm, đổi trả 7 ngày, giao toàn quốc." />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ACFMart" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ACFMart",
        "url": "https://acfmart.vn",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://acfmart.vn/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #f8f9fa; }
      #root { min-height: 100vh; }
      .acf-initial-loader {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; font-family: 'Be Vietnam Pro', system-ui, sans-serif;
        gap: 20px; background: #f8f9fa;
      }
      .acf-initial-loader img {
        width: 100px; height: auto;
        animation: acf-pulse 1.8s ease-in-out infinite;
      }
      .acf-initial-loader .acf-spinner {
        width: 28px; height: 28px;
        border: 3px solid rgba(220, 38, 38, 0.2); border-top-color: #dc2626;
        border-radius: 50%; animation: acf-spin 0.7s linear infinite;
      }
      .acf-initial-loader .acf-loader-text {
        font-size: 13px; color: #a3a3a3; margin-top: -8px;
      }
      .acf-initial-loader .acf-loader-slow {
        display: none; font-size: 12px; color: #d4d4d4; margin-top: -12px;
      }
      @keyframes acf-spin { to { transform: rotate(360deg); } }
      @keyframes acf-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.96); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="acf-initial-loader" id="acf-splash">
        <img src="/logov.png" alt="ACFMart" />
        <div class="acf-spinner"></div>
        <div class="acf-loader-text">Đang tải...</div>
        <div class="acf-loader-slow" id="acf-slow-hint">Kết nối chậm, vui lòng đợi...</div>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var hint = document.getElementById('acf-slow-hint');
        if (hint) hint.style.display = 'block';
      }, 5000);
    </script>
    <!-- 修改：将 /src/main.tsx 改为 ./main.tsx -->
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
