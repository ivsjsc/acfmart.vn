version: '3.9'

# Override cho development — hot reload với volumes
services:
  postgres:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  api:
    build:
      context: ./apps/api
      target: builder
    command: ['ts-node-dev', '--respawn', '--transpile-only', 'src/main.ts']
    volumes:
      - ./apps/api/src:/app/src:ro
      - /app/node_modules
    environment:
      NODE_ENV: development

  web:
    build:
      context: ./apps/web
      target: deps
    command: ['npm', 'run', 'dev']
    volumes:
      - ./apps/web:/app:ro
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
