name: acfmart_mobile
description: ACFMart mobile app for iOS and Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  dio: any
  firebase_analytics: any
  firebase_app_check: any
  firebase_auth: any
  firebase_core: any
  firebase_messaging: any
  firebase_remote_config: any
  firebase_storage: any
  flutter_local_notifications: any
  flutter_riverpod: any
  flutter_secure_storage: any
  connectivity_plus: any
  cached_network_image: any
  go_router: any
  intl: any
  shared_preferences: any
  url_launcher: any
  freezed_annotation: any
  json_annotation: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  freezed: any
  json_serializable: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
