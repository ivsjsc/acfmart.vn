version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medusadb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusadb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://medusa:password@postgres:5432/medusadb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwt
      COOKIE_SECRET: supercookie
      MEDUSA_BACKEND_URL: http://localhost:9000
      # Payment provider configs
      VITE_VNPAY_TMN_CODE: your_tmn_code
      VITE_VNPAY_HASH_SECRET: your_hash_secret
      VITE_MOMO_PARTNER_CODE: your_partner_code
      VITE_MOMO_ACCESS_KEY: your_access_key
      VITE_MOMO_SECRET_KEY: your_secret_key
      VITE_ZALOPAY_APP_ID: your_app_id
      VITE_ZALOPAY_KEY1: your_key1
      VITE_ZALOPAY_KEY2: your_key2
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: