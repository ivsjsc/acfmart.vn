<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#dc2626" />
  <title>acfmart — Sàn TMĐT chống hàng giả của Quỹ Chống Hàng Giả Việt Nam</title>
  <meta name="description" content="acfmart - Sàn thương mại điện tử chống hàng giả, xác thực sản phẩm chính hãng bằng QR. Mua sắm an tâm, đổi trả 7 ngày, giao toàn quốc." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    html, body { margin: 0; padding: 0; background: #f8f9fa; }
    #root { min-height: 100vh; }
    .acf-initial-loader {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: system-ui, sans-serif; font-size: 16px; color: #dc2626;
      gap: 12px;
    }
    .acf-initial-loader::after {
      content: ''; width: 22px; height: 22px;
      border: 3px solid rgba(220, 38, 38, 0.25); border-top-color: #dc2626;
      border-radius: 50%; animation: acf-spin 0.8s linear infinite;
    }
    @keyframes acf-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root">
    <div class="acf-initial-loader">Đang tải acfmart</div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
