<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACF Marketplace - Nền tảng thương mại điện tử xác thực chính hãng</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f8f9fa;
    }
    
    #root {
      display: flex;
      min-height: 100vh;
    }
    
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 18px;
      color: #d73532;
    }
    
    .loader::after {
      content: '';
      width: 24px;
      height: 24px;
      margin-left: 10px;
      border: 3px solid rgba(215, 53, 50, 0.3);
      border-top-color: #d73532;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loader">Đang tải ACF Marketplace...</div>
  </div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
