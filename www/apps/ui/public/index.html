<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACFMart - E-Commerce Platform</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            max-width: 500px;
        }
        h1 {
            color: #1a202c;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        p {
            color: #4a5568;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .status {
            background: #48bb78;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            display: inline-block;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ACFMart</h1>
        <p>Welcome to your e-commerce platform powered by Medusa and Firebase</p>
        <div class="status">🚀 Site is Live!</div>
    </div>
</body>
</html>
