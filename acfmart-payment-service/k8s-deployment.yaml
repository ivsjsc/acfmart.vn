apiVersion: apps/v1
kind: Deployment
metadata:
  name: acfmart-payment-service
  labels:
    app: acfmart-payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: acfmart-payment-service
  template:
    metadata:
      labels:
        app: acfmart-payment-service
    spec:
      containers:
      - name: payment-service
        image: acfmart/payment-service:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: payment-db-secret
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: payment-db-secret
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: payment-db-secret
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: payment-db-secret
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payment-db-secret
              key: db-password
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: payment-redis-secret
              key: redis-url
        - name: VNPAY_API_URL_PROD
          valueFrom:
            secretKeyRef:
              name: psp-secrets
              key: vnpay-api-url
        - name: VNPAY_TMNCODE_PROD
          valueFrom:
            secretKeyRef:
              name: psp-secrets
              key: vnpay-tmncode
        - name: VNPAY_HASHSECRET_PROD
          valueFrom:
            secretKeyRef:
              name: psp-secrets
              key: vnpay-hashsecret
        - name: MOMO_API_URL_PROD
          valueFrom:
            secretKeyRef:
              name: psp-secrets
              key: momo-api-url
        - name: MOMO_PARTNER_CODE_PROD
          valueFrom:
            secretKeyRef:
              name: psp-secrets
              key: momo-partner-code
        - name: MOMO_ACCESS_KEY_PROD
          valueFrom:
            secretKeyRef:
              name: psp-secrets
              key: momo-access-key
        - name: MOMO_SECRET_KEY_PROD
          valueFrom:
            secretKeyRef:
              name: psp-secrets
              key: momo-secret-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: webhook-secret
        - name: ESCROW_HOLD_DURATION_HOURS
          value: "24"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: acfmart-payment-service
  labels:
    app: acfmart-payment-service
spec:
  selector:
    app: acfmart-payment-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3001
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acfmart-payment-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - payment.acfmart.vn
    - api.payment.acfmart.vn
    secretName: acfmart-payment-tls
  rules:
  - host: payment.acfmart.vn
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: acfmart-payment-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: acfmart-payment-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: acfmart-payment-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80